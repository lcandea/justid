<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<!--
  Same policy as the app: no network requests of any kind (connect-src 'none'), no form submissions.
  The request is written into the link's #fragment, which browsers never send to a server.
  Opening the WhatsApp / email links below is a navigation chosen by the user, not a request from this page.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title data-i18n="meta.request_title">JustID</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="builder-body">
<noscript><p class="noscript" data-i18n="noscript">Esta herramienta necesita JavaScript. Todo se ejecuta en tu dispositivo: no se envía nada a ningún servidor.</p></noscript>
<header class="top">
  <div class="brand">
    <strong>JustID <small class="tagline" data-i18n="brand.tagline"></small></strong>
    <div class="brand-actions"><div class="lang-switch" id="lang"></div></div>
  </div>
</header>

<main class="flow builder">
  <p class="builder-nav"><a href="./" data-i18n="builder.back_to_app"></a></p>
  <h2 data-i18n="builder.title"></h2>
  <p class="muted" data-i18n="builder.intro"></p>

  <label class="lbl" for="b-from" data-i18n="builder.from_label"></label>
  <input type="text" id="b-from" maxlength="60" autocomplete="organization" data-i18n-attr="placeholder:builder.from_placeholder">

  <label class="lbl" for="b-purpose" data-i18n="builder.purpose_label"></label>
  <input type="text" id="b-purpose" maxlength="80" autocomplete="off" data-i18n-attr="placeholder:builder.purpose_placeholder">
  <div class="chips" id="b-chips"></div>

  <h3 data-i18n="builder.fields_title"></h3>
  <p class="muted" data-i18n="builder.fields_hint"></p>
  <div id="b-fields"></div>
  <label class="chk b-back"><input type="checkbox" id="b-back"><span><span data-i18n="builder.back"></span> <small class="muted hidden" id="b-back-forced" data-i18n="builder.back_forced"></small></span></label>

  <label class="lbl" for="b-why" id="b-why-label"></label>
  <textarea id="b-why" maxlength="240" rows="3" data-i18n-attr="placeholder:builder.why_placeholder"></textarea>
  <p class="muted b-count" id="b-why-count" aria-live="polite"></p>

  <h3 data-i18n="builder.delivery_title"></h3>
  <div class="seg" id="b-delivery">
    <button type="button" data-v="whatsapp" class="on" data-i18n="builder.delivery_whatsapp"></button><button type="button" data-v="email" data-i18n="builder.delivery_email"></button><button type="button" data-v="upload" data-i18n="builder.delivery_upload"></button>
  </div>
  <label class="lbl b-contact-lbl" for="b-contact" id="b-contact-label"></label>
  <div class="phone-row">
    <!-- Country calling code (WhatsApp only): opens a searchable list, see js/dial-picker.js -->
    <button type="button" class="dial-btn" id="b-dial" aria-haspopup="listbox" aria-expanded="false" aria-controls="b-dial-pop"></button>
    <input type="text" id="b-contact" maxlength="300" autocomplete="off">
  </div>
  <div class="dial-pop hidden" id="b-dial-pop">
    <input type="text" id="b-dial-search" role="combobox" aria-expanded="true" aria-controls="b-dial-list" aria-autocomplete="list" autocomplete="off" data-i18n-attr="placeholder:builder.dial_search;aria-label:builder.dial_search">
    <ul class="dial-list" id="b-dial-list" role="listbox" data-i18n-attr="aria-label:builder.dial_list"></ul>
    <p class="muted dial-empty hidden" id="b-dial-empty" data-i18n="builder.dial_none"></p>
  </div>
  <p class="muted b-phone-preview hidden" id="b-phone-preview" aria-live="polite"></p>

  <p class="status warn" id="b-error" role="alert"></p>
  <button type="button" class="primary big" id="b-create" data-i18n="builder.create"></button>

  <section class="b-result hidden" id="b-result" aria-labelledby="b-result-title">
    <h3 id="b-result-title" data-i18n="builder.result_title"></h3>
    <p class="muted" data-i18n="builder.result_hint"></p>
    <input type="text" id="b-link" readonly aria-labelledby="b-result-title">
    <div class="share-actions">
      <button type="button" class="primary big hidden" id="b-share" data-i18n="builder.share"></button>
      <button type="button" class="big" id="b-copy" data-i18n="builder.copy"></button>
      <a class="btn big" id="b-wa" target="_blank" rel="noopener noreferrer" data-i18n="builder.send_whatsapp"></a>
      <a class="btn big" id="b-mail" data-i18n="builder.send_email"></a>
      <a class="btn big" id="b-preview" target="_blank" rel="noopener" data-i18n="builder.preview"></a>
    </div>
    <p class="status" id="b-status" role="status"></p>
  </section>
</main>

<script type="module" src="js/request-page.js"></script>
</body>
</html>
