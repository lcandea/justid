<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Same policy as the app: no network requests of any kind. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title data-i18n="meta.editor_title">JustID</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<header>
  <div class="row" style="justify-content:space-between">
    <h1 data-i18n="editor.title"></h1>
    <div class="lang-switch" id="lang"></div>
  </div>
  <p data-i18n="editor.intro"></p>
  <nav><a href="index.html" data-i18n="editor.back"></a></nav>
</header>
<main class="app">
  <div style="display:grid;gap:16px">
    <section>
      <div class="row" style="justify-content:space-between">
        <div class="seg" id="side">
          <button type="button" data-v="front" class="on" data-i18n="side.front"></button><button type="button" data-v="back" data-i18n="side.back"></button>
        </div>
        <label class="btn file-btn"><span data-i18n="editor.load_image"></span><input type="file" id="img-file" accept="image/*"></label>
      </div>
      <p class="muted" id="hint" style="margin:8px 0" data-i18n="editor.hint"></p>
      <div class="canvas-wrap hidden" id="crop-wrap"><canvas id="crop"></canvas></div>
      <div class="row hidden" id="crop-bar" style="margin-top:8px">
        <button type="button" class="primary" id="crop-use" data-i18n="editor.crop_use"></button>
        <button type="button" id="crop-rot" data-i18n="editor.crop_rotate"></button>
        <button type="button" id="crop-full" data-i18n="editor.crop_full"></button>
      </div>
      <div class="canvas-wrap" id="board-wrap"><canvas id="board" style="touch-action:none;width:100%"></canvas></div>
    </section>
    <section>
      <h2 data-i18n="editor.json_title"></h2>
      <textarea class="json" id="json" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px">
        <button type="button" id="json-apply" data-i18n="editor.json_apply"></button>
      </div>
    </section>
  </div>
  <aside>
    <div>
      <h2 data-i18n="editor.template"></h2>
      <select id="tpl"></select>
      <div class="row" style="margin-top:8px">
        <button type="button" id="tpl-new" data-i18n="editor.new"></button>
        <label class="btn file-btn"><span data-i18n="editor.import"></span><input type="file" id="tpl-file" accept="application/json,.json"></label>
      </div>
      <label class="muted" style="display:block;margin-top:8px" for="tpl-name" data-i18n="editor.name"></label>
      <input type="text" id="tpl-name">
      <label class="muted" style="display:block;margin-top:8px" for="tpl-id" data-i18n="editor.id"></label>
      <input type="text" id="tpl-id">
    </div>
    <div>
      <h2 data-i18n="editor.fields"></h2>
      <p class="muted" data-i18n="editor.fields_hint"></p>
      <div id="fields"></div>
      <div class="row" style="margin-top:8px"><button type="button" id="field-add" data-i18n="editor.field_add"></button></div>
    </div>
    <div>
      <h2 data-i18n="editor.export"></h2>
      <div class="row">
        <button type="button" class="primary" id="exp-save" data-i18n="editor.save"></button>
        <button type="button" id="exp-dl" data-i18n="editor.download_json"></button>
        <button type="button" id="exp-module" data-i18n="editor.download_module"></button>
        <button type="button" id="exp-copy" data-i18n="editor.copy"></button>
      </div>
      <p class="status" id="exp-status" role="status"></p>
    </div>
  </aside>
</main>
<script type="module" src="js/editor.js"></script>
</body>
</html>
