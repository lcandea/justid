name: CI & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (JSDoc, no build)
        run: npm run typecheck
      - name: Unit tests (templates, translations, privacy guards)
        run: npm run test:unit
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests (full flow, CSP, detector)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # Publishes to GitHub Pages (https://justid.candea.es) only from main, only if tests passed.
  # The site is the repository files as-is: no build step, just a copy of the public folders.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the public files (tests, tools and source scans are not published)
        run: |
          mkdir _site
          cp -r index.html favicon.svg app locales templates _site/
          echo "justid.candea.es" > _site/CNAME
          find _site -type f | sort
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
