name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deployment is done by Cloudflare (Workers Builds) from this repository: production from main,
# preview URLs from every other branch. See wrangler.jsonc and tools/build-site.sh.

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (JSDoc, no build)
        run: npm run typecheck
      - name: Unit tests (templates, translations, privacy guards)
        run: npm run test:unit
      - name: Install Chromium and WebKit for Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests (full flow, CSP, detector)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
